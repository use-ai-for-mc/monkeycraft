name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-26-1:
    name: Build mod (Minecraft 26.1)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/26.1
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build

  build-1-21-11:
    name: Build mod (Minecraft 1.21.11)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/1.21.11
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build

  build-1-19:
    name: Build mod (Minecraft 1.19)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/1.19
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Loom 1.16 requires Java 21+ to load; compile still targets Java 17.
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build

  release:
    needs: [build-26-1, build-1-21-11, build-1-19]
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build 26.1
        working-directory: mods/26.1
        run: chmod +x ./gradlew && ./gradlew build

      - name: setup jdk 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: build 1.21.11
        working-directory: mods/1.21.11
        run: chmod +x ./gradlew && ./gradlew build

      # Loom 1.16 requires Java 21+ to load; compile still targets Java 17.
      - name: setup jdk for 1.19 (Loom needs 21+, compile targets 17)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: build 1.19
        working-directory: mods/1.19
        run: chmod +x ./gradlew && ./gradlew build

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mods/26.1/build/libs/*.jar
            mods/1.21.11/build/libs/*.jar
            mods/1.19/build/libs/*.jar
          generate_release_notes: true
