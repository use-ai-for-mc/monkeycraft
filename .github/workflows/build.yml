# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build-26-2:
    name: Build mod (Minecraft 26.2)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/26.2
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: check formatting
        run: ./gradlew spotlessCheck
      - name: build
        run: ./gradlew build
      - name: test
        run: ./gradlew test
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-26.2
          path: mods/26.2/build/libs/

  build-26-1:
    name: Build mod (Minecraft 26.1)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/26.1
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: test
        run: ./gradlew test
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-26.1
          path: mods/26.1/build/libs/

  build-1-21-11:
    name: Build mod (Minecraft 1.21.11)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/1.21.11
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: test
        run: ./gradlew test
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-1.21.11
          path: mods/1.21.11/build/libs/

  build-1-19:
    name: Build mod (Minecraft 1.19)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/1.19
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Loom 1.16 (pinned in gradle.properties for the unified toolchain)
      # requires Java 21+ to load as a Gradle plugin. Compilation still
      # targets Java 17 via the toolchain block in build.gradle, and
      # Gradle auto-downloads the JDK 17 it needs.
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: test
        run: ./gradlew test
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-1.19
          path: mods/1.19/build/libs/

  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flutter/monkeycraft
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: get dependencies
        run: flutter pub get
      - name: analyze
        run: flutter analyze
      - name: test
        run: flutter test
      - name: build web
        run: flutter build web --release --base-href /monkeycraft/
