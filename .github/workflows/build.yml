# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  resources:
    name: Build embedded mod resources
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download browser bundle
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: flutter/monkeycraft/build/web
      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: native/tailscale-helper/go.mod
          cache-dependency-path: native/tailscale-helper/go.sum
      - name: build embedded helpers
        working-directory: native/tailscale-helper
        run: ./scripts/build-all.sh
      - name: test embedded helpers
        working-directory: native/tailscale-helper
        run: go test ./...
      - name: race test embedded helper components
        working-directory: native/tailscale-helper
        run: go test -race ./internal/...
      - name: test helper with isolated local tailnet
        working-directory: native/tailscale-helper
        run: go test -mod=readonly -race -tags=integration ./internal/engine -run TestHermeticTailnetHelperForwardRestart -count=1 -timeout=90s
      - name: capture embedded helpers
        uses: actions/upload-artifact@v7
        with:
          name: tailscale-helper-dist
          path: |
            native/tailscale-helper/dist/
            native/tailscale-helper/LICENSE.tailscale

  build-26-2:
    name: Build mod (Minecraft 26.2)
    needs: resources
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/26.2
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download browser bundle
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: flutter/monkeycraft/build/web
      - name: download embedded helpers
        uses: actions/download-artifact@v7
        with:
          name: tailscale-helper-dist
          path: native/tailscale-helper
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: check formatting
        run: ./gradlew spotlessCheck
      - name: build
        run: ./gradlew build
      - name: test
        run: ./gradlew test
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-26.2
          path: mods/26.2/build/libs/

  build-26-1:
    name: Build mod (Minecraft 26.1)
    needs: resources
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/26.1
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download browser bundle
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: flutter/monkeycraft/build/web
      - name: download embedded helpers
        uses: actions/download-artifact@v7
        with:
          name: tailscale-helper-dist
          path: native/tailscale-helper
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: test
        run: ./gradlew test
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-26.1
          path: mods/26.1/build/libs/

  build-1-21-11:
    name: Build mod (Minecraft 1.21.11)
    needs: resources
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/1.21.11
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download browser bundle
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: flutter/monkeycraft/build/web
      - name: download embedded helpers
        uses: actions/download-artifact@v7
        with:
          name: tailscale-helper-dist
          path: native/tailscale-helper
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: test
        run: ./gradlew test
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-1.21.11
          path: mods/1.21.11/build/libs/

  build-1-19:
    name: Build mod (Minecraft 1.19)
    needs: resources
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/1.19
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download browser bundle
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: flutter/monkeycraft/build/web
      - name: download embedded helpers
        uses: actions/download-artifact@v7
        with:
          name: tailscale-helper-dist
          path: native/tailscale-helper
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Loom 1.16 (pinned in gradle.properties for the unified toolchain)
      # requires Java 21+ to load as a Gradle plugin. Compilation still
      # targets Java 17 via the toolchain block in build.gradle, and
      # Gradle auto-downloads the JDK 17 it needs.
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: test
        run: ./gradlew test
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-1.19
          path: mods/1.19/build/libs/

  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flutter/monkeycraft
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup Java for Android
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: setup go for Android embedded Tailscale
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
      - name: setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: install native toolchain
        run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: build Android embedded Tailscale
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" ./android/third_party/libtailscale/build.sh
      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
      - name: get dependencies
        run: flutter pub get
      - name: analyze
        run: flutter analyze
      - name: test
        run: flutter test
      - name: build Android
        run: flutter build apk --debug
      - name: test Android native login lifecycle
        working-directory: flutter/monkeycraft/android
        run: ./gradlew :app:testDebugUnitTest --tests com.chenweikeng.monkeycraft.AuthUrlLaunchGateTest
      - name: verify Android native packaging
        run: python3 android/third_party/libtailscale/verify_apk.py build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: Build iOS release without signing
    runs-on: macos-26
    defaults:
      run:
        working-directory: flutter/monkeycraft
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup Go for iOS embedded Tailscale
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
      - name: build iOS embedded Tailscale
        run: LIBTAILSCALE_GO="$(go env GOROOT)/bin/go" ./ios/third_party/libtailscale/build.sh ios
      - name: setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
      - name: get dependencies
        run: flutter pub get
      - name: build iOS release without signing
        run: flutter build ios --release --no-codesign

  web:
    name: Flutter Web client
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flutter/monkeycraft
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
      - name: get dependencies
        run: flutter pub get --enforce-lockfile
      - name: analyze
        run: flutter analyze
      - name: test
        run: flutter test
      - name: build root-path web bundle for embedded Mods
        run: MONKEYCRAFT_PAGES_PROVENANCE=0 tool/build_web_release.sh / build/web
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: flutter/monkeycraft/build/web/
