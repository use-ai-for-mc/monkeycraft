name: Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the prepared artifact to GitHub Pages
        required: true
        default: false
        type: boolean
      pages_base:
        description: Project path, or / after a custom domain is configured
        required: true
        default: /monkeycraft/
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.2
  FLUTTER_FRAMEWORK_COMMIT: 90673a4eef275d1a6692c26ac80d6d746d41a73a

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Install the pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin "$FLUTTER_FRAMEWORK_COMMIT" "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse "$FLUTTER_VERSION^{commit}")" = "$FLUTTER_FRAMEWORK_COMMIT"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_FRAMEWORK_COMMIT"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_FRAMEWORK_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version --machine
      - run: flutter --version --machine
      - working-directory: flutter/monkeycraft
        run: flutter pub get --enforce-lockfile
      - working-directory: flutter/monkeycraft
        run: flutter analyze
      - name: Build the Flutter Pages artifact
        working-directory: flutter/monkeycraft
        run: tool/build_web_release.sh
        env:
          MONKEYCRAFT_PAGES_BASE: ${{ inputs.pages_base }}
          MONKEYCRAFT_FLUTTER_FRAMEWORK_COMMIT: ${{ env.FLUTTER_FRAMEWORK_COMMIT }}
          GITHUB_WORKFLOW_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: flutter/monkeycraft/build/pages

  deploy:
    if: inputs.publish && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
