name: Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the prepared artifact to GitHub Pages
        required: true
        default: false
        type: boolean
      pages_base:
        description: Project path, or / after a custom domain is configured
        required: true
        default: /monkeycraft/
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web test:pages-provenance
      - run: pnpm --dir web build:pages
        env:
          MONKEYCRAFT_PAGES_BASE: ${{ inputs.pages_base }}
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Verify the Pages client
        run: pnpm --dir web exec playwright test test/browser/pages.spec.ts test/browser/credential.spec.ts test/browser/notifications.spec.ts test/browser/reconnect.spec.ts
        env:
          MONKEYCRAFT_PAGES: "1"
          MONKEYCRAFT_PAGES_BASE: ${{ inputs.pages_base }}
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173${{ inputs.pages_base }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: web/dist-pages

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
