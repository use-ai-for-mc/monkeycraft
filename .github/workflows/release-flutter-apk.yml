name: release-flutter-apk

on:
  push:
    tags:
      - 'flutter-v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for release (e.g. flutter-v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup Java for Android
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup Go for Android embedded Tailscale
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: install native toolchain
        run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: build Android embedded Tailscale
        working-directory: flutter/monkeycraft
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" ./android/third_party/libtailscale/build.sh

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: install dependencies
        working-directory: flutter/monkeycraft
        run: flutter pub get

      - name: build apk
        working-directory: flutter/monkeycraft
        run: flutter build apk --release

      - name: rename apk
        working-directory: flutter/monkeycraft
        run: |
          VERSION=$(cat pubspec.yaml | grep '^version:' | awk '{print $2}')
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/monkeycraft-$VERSION.apk

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: flutter/monkeycraft/build/app/outputs/flutter-apk/monkeycraft-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
