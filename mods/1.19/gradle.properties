# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Auto-download a matching JDK 17 if one isn't discoverable on the host
# (Homebrew openjdk@17 isn't symlinked into /Library/Java/VirtualMachines
# by default, so auto-detect alone can miss it).
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.19
yarn_mappings=1.19+build.4
loader_version=0.14.22
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=1.4.1-1.19
maven_group=com.chenweikeng.monkeycraft
archives_base_name=monkeycraft

# API Properties
api_version=1.0.0

# Dependencies
fabric_api_version=0.58.0+1.19
cloth_config_version=8.3.115
modmenu_version=4.0.6
websocket_version=1.5.4
jcodec_version=0.2.5
