plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '8.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

spotless {
	java {
		target 'src/*/java/**/*.java'
		googleJavaFormat()
	}
}

repositories {
	mavenCentral()
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
	maven {
		name = "Gnomecraft"
		url = "https://maven.gnomecraft.net/releases/"
		content {
			includeGroup "com.terraformersmc"
		}
	}
	maven { url = "https://maven.nucleoid.xyz/" }
	maven { url = "https://jitpack.io" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings needed - MC 26.1 is unobfuscated
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	implementation "org.java-websocket:Java-WebSocket:${project.websocket_version}"
	include "org.java-websocket:Java-WebSocket:${project.websocket_version}"

	implementation "org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"
	implementation "org.bouncycastle:bcutil-jdk18on:${project.bouncycastle_version}"
	implementation "org.bouncycastle:bcpkix-jdk18on:${project.bouncycastle_version}"
	include "org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"
	include "org.bouncycastle:bcutil-jdk18on:${project.bouncycastle_version}"
	include "org.bouncycastle:bcpkix-jdk18on:${project.bouncycastle_version}"

	implementation "org.jcodec:jcodec:${project.jcodec_version}"
	implementation "org.jcodec:jcodec-javase:${project.jcodec_version}"
	include "org.jcodec:jcodec:${project.jcodec_version}"
	include "org.jcodec:jcodec-javase:${project.jcodec_version}"

	implementation "com.google.zxing:core:3.5.3"
	include "com.google.zxing:core:3.5.3"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	implementation("com.github.weikengchen:monkeycraft-api:1.0.0-mc26.1"){
		transitive = false
	}
	include "com.github.weikengchen:monkeycraft-api:1.0.0-mc26.1"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
