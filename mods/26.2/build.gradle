plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '8.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

spotless {
	java {
		target 'src/*/java/**/*.java'
		googleJavaFormat()
	}
}

repositories {
	mavenCentral()
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
	maven {
		name = "Gnomecraft"
		url = "https://maven.gnomecraft.net/releases/"
		content {
			includeGroup "com.terraformersmc"
		}
	}
	maven { url = "https://maven.nucleoid.xyz/" }
	maven { url = "https://jitpack.io" }
}

def javaTailscaleRoot = file("../../native/tailscale-java")
def buildJavaTailscale = tasks.register("buildJavaTailscale", Exec) {
    inputs.files(fileTree(javaTailscaleRoot) {
        exclude "build/**", "dist/**", ".cache/**", "**/__pycache__/**"
    })
    outputs.files(new File(javaTailscaleRoot, "build/tailscale-java.jar"),
        new File(javaTailscaleRoot, "build/bc-lightweight-subset-1.86.jar"),
        new File(javaTailscaleRoot, ".cache/dependencies/netty-codec-http2-4.2.18.Final.jar"))
    workingDir javaTailscaleRoot
    commandLine providers.gradleProperty("pythonExecutable").getOrElse("python3"), "tools/build.py"
    doFirst {
        environment "JAVA_HOME", javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }.get().metadata.installationPath.asFile.absolutePath
    }
}
def javaTailscaleJars = files(
    new File(javaTailscaleRoot, "build/tailscale-java.jar"),
    new File(javaTailscaleRoot, "build/bc-lightweight-subset-1.86.jar"),
    new File(javaTailscaleRoot, ".cache/dependencies/netty-codec-http2-4.2.18.Final.jar")
).builtBy(buildJavaTailscale)

dependencies {
    implementation javaTailscaleJars
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings needed - MC 26.2 is unobfuscated
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	implementation "org.java-websocket:Java-WebSocket:${project.websocket_version}"
	include "org.java-websocket:Java-WebSocket:${project.websocket_version}"

	implementation "org.jcodec:jcodec:${project.jcodec_version}"
	implementation "org.jcodec:jcodec-javase:${project.jcodec_version}"
	include "org.jcodec:jcodec:${project.jcodec_version}"
	include "org.jcodec:jcodec-javase:${project.jcodec_version}"

	implementation "com.google.zxing:core:3.5.3"
	include "com.google.zxing:core:3.5.3"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	implementation("com.github.weikengchen:monkeycraft-api:1.0.0-mc26.2"){
		transitive = false
	}
	include "com.github.weikengchen:monkeycraft-api:1.0.0-mc26.2"
}

def browserWeb = file("${rootProject.projectDir}/../../flutter/monkeycraft/build/web")

def helperRoot = file("${rootProject.projectDir}/../../native/tailscale-helper")
def helperPlatforms = ["darwin-arm64", "windows-amd64"]

tasks.register("verifyTailscaleHelpers") {
	inputs.dir new File(helperRoot, "dist")
	doLast {
		helperPlatforms.each { platform ->
			def dir = new File(helperRoot, "dist/${platform}")
			def manifestFile = new File(dir, "manifest.json")
			if (!manifestFile.isFile()) {
				throw new GradleException("Missing embedded Tailscale helper for ${platform}. Run native/tailscale-helper/scripts/build-all.sh.")
			}
			def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
			def name = "monkeycraft-tailscale-helper" + (platform.startsWith("windows-") ? ".exe" : "")
			def binary = new File(dir, name)
			if (manifest.protocolVersion != 1 || manifest.name != name || "${manifest.goos}-${manifest.goarch}" != platform || !binary.isFile()) {
				throw new GradleException("Invalid embedded Tailscale manifest for ${platform}")
			}
			def digest = java.security.MessageDigest.getInstance("SHA-256")
			binary.withInputStream { stream ->
				byte[] buffer = new byte[65536]
				int count
				while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
			}
			if (digest.digest().encodeHex().toString() != manifest.sha256 || binary.length() != manifest.size) {
				throw new GradleException("Embedded Tailscale helper integrity mismatch for ${platform}")
			}
		}
		if (!new File(helperRoot, "LICENSE.tailscale").isFile()) {
			throw new GradleException("Embedded Tailscale license is missing")
		}
	}
}

processResources {
	doFirst {
		delete new File(destinationDir, "native/tailscale/darwin-amd64")
		delete new File(destinationDir, "native/tailscale/linux-amd64")
	}
	dependsOn "verifyTailscaleHelpers"
	helperPlatforms.each { platform ->
		from(new File(helperRoot, "dist/${platform}")) {
			include "monkeycraft-tailscale-helper", "monkeycraft-tailscale-helper.exe", "*.sha256", "manifest.json"
			into "native/tailscale/${platform}"
		}
	}
	from(new File(helperRoot, "LICENSE.tailscale")) {
		into "native/tailscale"
	}
	inputs.property "version", project.version
    inputs.property "tailscaleBackend", providers.gradleProperty("tailscaleBackend").getOrElse("helper")
    doLast {
        new File(destinationDir, "monkeycraft-tailscale-backend.txt").text = inputs.properties.tailscaleBackend + "\n"
    }
	inputs.dir browserWeb
	from(browserWeb) {
		exclude "tailscale/**"
		into "web"
	}
	doFirst {
		def index = new File(browserWeb, "index.html")
		if (!index.isFile() || !new File(browserWeb, "flutter_bootstrap.js").isFile() || !new File(browserWeb, "main.dart.js").isFile()) {
			throw new GradleException("Flutter browser bundle missing. Run flutter/monkeycraft/tool/build_web_release.sh / build/web first.")
		}
		if (!index.getText("UTF-8").contains('<base href="/">')) {
			throw new GradleException("Flutter browser bundle must use root base href /. Run flutter/monkeycraft/tool/build_web_release.sh / build/web first.")
		}
		if (new File(browserWeb, "tailscale").exists()) {
			throw new GradleException("Flutter browser bundle contains ignored Tailscale experiment assets. Rebuild it with flutter/monkeycraft/tool/build_web_release.sh.")
		}
	}

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
    systemProperty "monkeycraft.expectedVersion", project.version
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
    dependsOn buildJavaTailscale
    from({ javaTailscaleJars.collect { zipTree(it) } }) {
        exclude "META-INF/MANIFEST.MF", "META-INF/INDEX.LIST", "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
