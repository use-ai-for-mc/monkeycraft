<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/Icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MonkeyCraft</title>
    <script>
      if ("serviceWorker" in navigator) {
        const legacyWorker = new URL("%BASE_URL%flutter_service_worker.js", location.origin).href;
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const reg of regs) {
            const scripts = [reg.active, reg.installing, reg.waiting].map((worker) => worker?.scriptURL);
            if (scripts.includes(legacyWorker)) reg.unregister();
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
